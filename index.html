<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calza Retail – POS (single store)</title>
<style>
:root{--bg:#f2f0eb;--card:#fff;--ink:#1f1c17;--mut:#6f6a60;--line:#e6e2d8;--g:#0f6b58;--t:#3dbba0;--soft:#dcefe8;--bar:#86c5b4;--trk:#efeae0;--side:#1f1c17;--rd:#b5400c;--rs:#fbe9dc;--in:#faf8f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130f;--card:#201d17;--ink:#f2f0eb;--mut:#a39d92;--line:#38332a;--soft:#17322b;--trk:#2c2820;--in:#1a1813}}
:root[data-theme="dark"]{--bg:#15130f;--card:#201d17;--ink:#f2f0eb;--mut:#a39d92;--line:#38332a;--soft:#17322b;--trk:#2c2820;--in:#1a1813}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif}
.tabs{display:flex;gap:6px;padding:8px 12px;background:#000;overflow-x:auto;position:sticky;top:0;z-index:9}
.tabs button{border:0;background:#2a2620;color:#ddd;padding:6px 12px;border-radius:16px;cursor:pointer;white-space:nowrap;font:12px inherit;font-family:inherit}.tabs .on{background:var(--t);color:#0b2a22;font-weight:700}
.scr{display:none}.scr.on{display:block}
.app{display:grid;grid-template-columns:212px 1fr;min-height:calc(100vh - 40px)}
aside{background:var(--side);color:#e9e5db;padding:18px 13px;display:flex;flex-direction:column;gap:3px}
.br{display:flex;gap:10px;align-items:center;margin-bottom:14px}.br small{display:block;color:#a9a396;font-size:12px}
.lg{width:34px;height:34px;border-radius:9px;background:var(--t);color:#0b2a22;display:grid;place-items:center;font-weight:800}
.st{border:1px solid #38332b;background:#27231d;border-radius:9px;padding:9px 12px;font-size:12.5px;font-weight:600;margin-bottom:12px}
.nv{padding:10px 12px;border-radius:8px;display:flex;gap:10px;cursor:pointer;align-items:center}.nv i{margin-left:auto;font:11px inherit;opacity:.55}.nv.on{background:var(--t);color:#0b2a22;font-weight:700}
.sy{margin-top:auto;background:#27231d;border-radius:9px;padding:9px 11px;font-size:11.5px;color:#b9b3a6}
.us{display:flex;gap:10px;align-items:center;margin-top:10px}.us span{width:34px;height:34px;border-radius:50%;background:#ece7da;color:#1f1c17;display:grid;place-items:center;font-weight:700;font-size:12px}.us small{display:block;color:#a9a396;font-size:11.5px}
main{padding:22px 24px;min-width:0}
h1{margin:0;font-size:26px;letter-spacing:-.4px}h2{margin:0 0 10px;font-size:17px}
.sb{color:var(--mut);font-size:12.5px}.hd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.k4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.k4 .cd{margin:0}
.lb{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);font-weight:600}
.bg{font:600 27px ui-monospace,Menlo,Consolas,monospace;margin:3px 0}.m{font-family:ui-monospace,Menlo,Consolas,monospace}
.w{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:12px;margin-top:12px}.w2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
.b{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:8px;font:600 13px inherit;font-family:inherit;cursor:pointer}.b.p{background:var(--g);border-color:var(--g);color:#fff}.b.r{background:var(--rd);border-color:var(--rd);color:#fff}
.sg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}.sg span{padding:8px 14px;font-weight:600;cursor:pointer}.sg .on{background:var(--g);color:#fff}
.bar{display:grid;grid-template-columns:120px 1fr 120px;gap:12px;align-items:center;margin:9px 0}.tr{height:19px;background:var(--trk);border-radius:4px;overflow:hidden}.tr i{display:block;height:100%;background:var(--bar)}.tr i.c{background:var(--g)}
.rw{display:flex;justify-content:space-between;padding:4px 0}.rw.t{border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-weight:700}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px}.qa .b{padding:11px 6px}
label,.fl{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);font-weight:600;margin:12px 0 5px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.lgn{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 40px)}.lgn .l{background:var(--side);color:#ece8dd;padding:50px 54px;display:flex;flex-direction:column;justify-content:space-between}
.l h1{font-size:50px;line-height:1.08;margin-bottom:18px}.l p{color:#c9c3b6;font-size:16px;max-width:480px}.lgn .r{display:grid;place-items:center;padding:30px}.r div.x{width:100%;max-width:390px}
.chip{display:inline-block;padding:3px 10px;border-radius:14px;background:var(--soft);color:var(--g);font-size:12px;font-weight:600;border:1px solid transparent}.chip.o{background:var(--card);border-color:var(--line);color:var(--ink)}
.net{background:var(--g);color:#fff;border-radius:10px;padding:14px 16px;margin:12px 0}.net.rd{background:var(--rd)}.net .bg{font-size:38px;margin:0}
.ph{width:92px;height:92px;border-radius:8px;background:var(--trk);display:grid;place-items:center;text-align:center;font-size:12px;color:var(--mut);flex:none}
.cl{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}.co{border:1.5px solid var(--line);border-radius:9px;padding:6px 12px 6px 8px;display:flex;gap:8px;align-items:center;cursor:pointer;background:var(--card)}.co.on{border-color:var(--g);background:var(--soft)}.co u{width:18px;height:18px;border-radius:50%;border:1px solid #0003}.co small{display:block;color:var(--mut);font-size:11px;line-height:1.1}
.zl{display:flex;gap:8px;margin:6px 0}.z{width:52px;border:1px solid var(--line);border-radius:8px;text-align:center;padding:5px 0;cursor:pointer;background:var(--card);font-weight:600}.z small{display:block;color:var(--mut);font-weight:400}.z.on{background:var(--g);color:#fff}.z.on small{color:#cfe}.z.x{opacity:.4;pointer-events:none}
table{width:100%;border-collapse:collapse}th{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);text-align:left;padding:9px 8px;background:var(--in)}td{padding:10px 8px;border-top:1px solid var(--line)}td.n,th.n{text-align:right}.sx{overflow-x:auto}
.rp{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:18px}.rp .cd{margin:0;padding:12px 14px;cursor:pointer;min-height:66px}.rp b{display:flex;justify-content:space-between}.rp span{color:var(--mut);font-size:12px}
.ok{background:var(--soft);color:var(--g);font-weight:700;padding:9px 12px;border-radius:8px;margin-top:8px}
.mx input{width:54px;padding:6px 4px;text-align:center}.mx td,.mx th{padding:6px 4px}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{flex-direction:row;overflow-x:auto;align-items:center}.st,.sy,.us{display:none}.nv{white-space:nowrap}.w,.w2,.lgn{grid-template-columns:1fr}.l{display:none}main{padding:14px}.bar{grid-template-columns:90px 1fr 100px}}
</style></head><body>
<div class="tabs" id="tabs"></div><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const NAV=[['▦','Dashboard','dash'],['🛒','New Sale','sale','F2'],['↩','Sale Return','ret','F3'],['▢','Products','add'],['▥','Reports','rep'],['⚙','Settings','dash']];
const T={login:'Sign in',dash:'Dashboard',sale:'New Sale',ret:'Sale Return',add:'Add Product',rep:'Reports',biz:'Business Report',cons:'Sale Report',com:'Commission'};
let out='';
const shell=(id,act,h)=>out+=`<section class="scr" id="${id}"><div class="app"><aside><div class="br"><div class="lg">C</div><div><b>Calza</b><small>Outlet Store</small></div></div><div class="st">Store: Calza</div>${NAV.map(n=>`<div class="nv ${n[1]==act?'on':''}" onclick="go('${n[2]}')"><span>${n[0]}</span>${n[1]}<i>${n[3]||''}</i></div>`).join('')}<div class="sy"></div><div class="us"><span>MA</span><div><b>Majid</b><small>Cashier · since 4:05 PM</small></div></div></aside><main>${h}</main></div></section>`;
const rows=a=>a.map(r=>`<div class="rw"><span>${r[0]}</span><span class="m">${r[1]}</span></div>`).join('');
const hd=(t,r='')=>`<div class="hd"><h1>${t}</h1><div>${r}</div></div>`;

out+=`<section class="scr on" id="login"><div class="lgn"><div class="l"><div class="br"><div class="lg">C</div><b style="font-size:17px">Calza Retail</b></div><div><h1>Every pair,<br>one till.</h1><p>Sell, return and reconcile from any counter. Stock by size and colour and day-close figures stay in sync across your store.</p></div><span></span></div>
<div class="r"><div class="x"><h1 style="font-size:30px">Sign in</h1><p class="sb">Use your counter account to start a shift.</p>
<label>Store</label><select><option>Calza</option><option>Abdul Hakim</option><option>Kot Addu</option><option>Layyah Store</option><option>Shuja Abad Store</option><option>Taunsa</option></select>
<label>User name</label><input value="Majid"><label>Password</label><div style="position:relative"><input id="pw" type="password" value="1234"><a onclick="pw.type=pw.type=='password'?'text':'password'" style="position:absolute;right:14px;top:11px;color:var(--g);font-weight:700;font-size:12px;cursor:pointer">Show</a></div>
<div class="hd" style="margin:16px 0"><span><input type="checkbox" style="width:auto;margin-right:6px">Remember this device</span><a style="color:var(--g);font-weight:700;text-decoration:underline">Forgot password</a></div>
<button class="b p" style="width:100%;padding:14px" onclick="go('dash')">Sign in</button><p class="sb" style="text-align:center;margin-top:16px">Support: Eagle's View Tech. · 0300-7543063</p></div></div></div></section>`;

const cats=[['SB Shoes',5999,'44.10'],['Sandals',4700,'41.20'],['Chappals',2734,'47.80'],['Sneakers',2000,'39.50']];
shell('dash','Dashboard',`<div class="hd"><div><span class="sb">Tuesday, 25 Aug 2026 · Calza store</span><h1>Good afternoon, Majid</h1></div><div><span class="sg"><span class="on">Today</span><span>Week</span><span>Month</span></span> <button class="b p" onclick="go('sale')">New sale · F2</button></div></div>
<div class="k4"><div class="cd"><div class="lb">Net sales</div><div class="bg">15,433</div><span class="sb">New 16,532 − returns 1,099</span></div><div class="cd"><div class="lb">Bills</div><div class="bg">10</div><span class="sb">9 pairs net · 1 returned</span></div><div class="cd"><div class="lb">Expenses</div><div class="bg">3,340</div><span class="sb">Paid from till today</span></div><div class="cd"><div class="lb">Cash in drawer</div><div class="bg">181,363</div><span class="sb">Bank 95,690 · difference 0</span></div></div>
<div class="w"><div class="cd" style="align-self:start"><div class="hd" style="margin:0"><h2>Sales by category</h2><span class="sb">Sale value for the selected day, PKR</span></div>${cats.map((c,i)=>`<div class="bar"><span>${c[0]}</span><div class="tr"><i class="${i?'':'c'}" style="width:${c[1]/6000*100}%"></i></div><span class="m" style="text-align:right">${c[1].toLocaleString()} <span class="sb">· ${c[2]}%</span></span></div>`).join('')}<p class="sb">Figure after the dot is profit %. Top category is the darker bar.</p></div>
<div><div class="cd"><h2>Cash position</h2>${rows([['Opening cash','169,270'],['+ Cash sale','15,433'],['+ Recovery','0'],['− Expenses','3,340']])}<div class="rw t"><span>Closing cash</span><span class="m">181,363</span></div><button class="b" style="width:100%;margin-top:10px" onclick="go('biz')">Close day</button></div>
<div class="cd"><h2>Quick actions</h2><div class="qa"><button class="b" onclick="go('ret')">Sale return</button><button class="b">Add expense</button><button class="b" onclick="go('add')">Add product</button><button class="b">Stock check</button><button class="b">Receive payment</button><button class="b">Print labels</button></div></div></div></div>`);

const rr=(a,b,c,d,e)=>`<tr><td>${a}</td><td><b>${b}</b><br><span class="sb">${c}</span></td><td>${d}</td><td>Pair</td><td class="n m">${e[0]}</td><td class="n m">${e[1]}</td><td class="n m">${e[2]}</td><td class="n m">${e[3]}</td><td class="n m"><b>${e[4]}</b></td></tr>`;
shell('sale','New Sale',`<div class="hd"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><h1>New Sale</h1><span class="chip o m">Invoice #27774</span><span class="chip o m">Daily bill 7</span><span class="chip o">25 Aug 2026</span><span class="chip m">Today PKR 15,433</span></div><div><button class="b">Held bills · 2</button> <button class="b">Last bill</button></div></div>
<div class="w2"><div>
<div class="cd"><div class="lb">Scan or search product · F2</div><div style="display:flex;gap:10px;margin:7px 0 14px"><input value="X 426469" style="border-color:var(--g);border-width:1.5px;font-size:16px"><label style="margin:0;display:flex;gap:6px;align-items:center;white-space:nowrap;text-transform:none;letter-spacing:0;font-size:13px"><input type="checkbox" style="width:auto">Manual entry</label><button class="b" style="white-space:nowrap">+ New product</button></div><hr style="border:0;border-top:1px solid var(--line)">
<div style="display:flex;gap:16px;margin-top:14px"><div class="ph">Product<br>photo</div><div style="flex:1"><b style="font-size:16px" id="pn"></b><div class="sb">Skooz · Summer · Boy 3 · SB Shoes</div>
<div class="lb" style="margin-top:12px">Colour · pick one</div><div class="cl" id="cl"></div>
<div class="lb" style="margin-top:8px" id="szl"></div><div class="zl" id="zl"></div></div></div>
<div class="f2" style="max-width:420px"><div><label>Qty</label><input value="1"></div><div><label>Price</label><input value="1,999"></div><div><label>Disc %</label><input value="0"></div><div><label>Discount</label><input value="0"></div></div>
<button class="b p" style="width:100%;max-width:420px;margin-top:14px;padding:12px" id="ab">Add to bill · 1,999 (Enter)</button></div>
<div class="cd"><div class="f3" style="grid-template-columns:1.2fr .9fr 1.2fr"><div><label style="margin-top:0">Customer</label><div style="display:flex;gap:8px"><select><option>Cash Sale</option></select><span class="chip m" style="background:var(--rs);color:var(--rd);padding:9px">11,929 Dr</span></div></div><div></div><div><label style="margin-top:0">Salesman</label><select><option>Select salesman</option></select></div></div><label>Mobile</label><input placeholder="03XX-XXXXXXX" style="max-width:220px"></div>
<div class="cd sx" style="padding:0"><table><tr><th>#</th><th>Product</th><th>Size</th><th>Unit</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Dis %</th><th class="n">Disc/Unit</th><th class="n">Total</th></tr>
<tr><td>1</td><td><b>X 426469 Blk 2/5</b><br><span class="sb">Skooz · Black · SB Shoes</span></td><td>5</td><td>Pair</td><td class="n m">1</td><td class="n m">1,999</td><td class="n m">0</td><td class="n m">0</td><td class="n m"><b>1,999</b></td></tr>
<tr><td>2</td><td><b>3chp 008 Pch</b><br><span class="sb">Sample item · Peach</span></td><td>11</td><td>Pair</td><td class="n m">2</td><td class="n m">899</td><td class="n m">5</td><td class="n m">45</td><td class="n m"><b>1,708</b></td></tr>
<tr><td>3</td><td><b>3snd 003 Skn</b><br><span class="sb">Sample item · Skin</span></td><td>7</td><td>Pair</td><td class="n m">1</td><td class="n m">2,700</td><td class="n m">0</td><td class="n m">0</td><td class="n m"><b>2,700</b></td></tr></table><div style="display:flex;gap:10px;padding:10px;border-top:1px solid var(--line);align-items:center"></div></div></div>
<div><div class="cd">${rows([['Items','3'],['Quantity','4'],['Gross bill','6,497'],['Discount','− 90']])}<div class="net"><div class="lb" style="color:#cfe9e1">Net bill · V# 25552</div><div class="bg">6,407</div></div>
<div class="lb">Payment (split allowed)</div><div class="sg" style="display:flex;margin:6px 0 10px"><span class="on" style="flex:1;text-align:center">Cash</span><span style="flex:1;text-align:center">Card</span><span style="flex:1;text-align:center">Bank</span><span style="flex:1;text-align:center">Wallet</span></div>
<div class="rw"><span>Cash in hand</span><input value="5,000" class="m" style="width:110px;text-align:right"></div><div class="rw"><span>Card</span><input value="1,407" class="m" style="width:110px;text-align:right"></div><div class="rw"><span>Cash received</span><input value="5,000" class="m" style="width:110px;text-align:right"></div><div class="rw" style="background:var(--soft);padding:8px 10px;border-radius:8px;margin-top:6px"><span>Cash return</span><span class="m">0</span></div>
<div class="lb" style="margin-top:14px">Print</div><div class="sg" style="display:flex;margin:6px 0"><span class="on" style="flex:1;text-align:center">Thermal</span><span style="flex:1;text-align:center">A4</span><span style="flex:1;text-align:center">A5</span></div><div class="sg" style="display:flex"><span class="on" style="flex:1;text-align:center">English</span><span style="flex:1;text-align:center">اردو</span></div>
<label style="text-transform:none;letter-spacing:0;font-size:13px;font-weight:400"><input type="checkbox" style="width:auto;margin-right:6px">Print gate pass</label><button class="b p" style="width:100%;padding:13px;margin:6px 0">Save &amp; Print F9</button><div class="f3"><button class="b">Save</button><button class="b">Hold</button><button class="b" style="color:var(--rd)">Reset</button></div></div></div></div>`);

shell('ret','Sale Return',`<div class="hd"><div style="display:flex;gap:8px;align-items:center"><h1>Sale Return</h1><span class="chip m" style="background:var(--rs);color:var(--rd)">Return V# 2561</span><span class="chip o m">25 Aug 2026</span></div></div>
<div class="w2"><div><div class="cd"><div class="lb">Find original bill</div><div style="display:flex;gap:10px;margin:7px 0 12px"><input value="27770" style="border-color:var(--rd);border-width:1.5px"><button class="b">Look up</button><button class="b" style="white-space:nowrap">Return without bill</button></div><div style="background:var(--in);padding:10px 12px;border-radius:8px" class="sb">Bill <b class="m" style="color:var(--ink)">#27770</b> &nbsp; Customer <b style="color:var(--ink)">Cash Sale</b> &nbsp; Sold on <b style="color:var(--ink)">25 Aug 2026, 1:12 PM</b> &nbsp; Salesman [name]</div></div>
<div class="cd sx" style="padding:0"><table><tr><th>Return</th><th>Product</th><th>Colour</th><th>Size</th><th class="n">Sold</th><th class="n">Return qty</th><th class="n">Price paid</th><th class="n">Refund</th><th>Condition</th></tr><tr><td><input type="checkbox" checked style="width:auto"></td><td><b>3chp 001 Yel</b><br><span class="sb">Sample item</span></td><td>Yellow</td><td>9</td><td class="n m">1</td><td class="n m">1</td><td class="n m">1,099</td><td class="n m"><b>1,099</b></td><td><select><option>Resellable</option></select></td></tr><tr><td><input type="checkbox" style="width:auto"></td><td><b>3chp 008 Pch</b><br><span class="sb">Sample item</span></td><td>Peach</td><td>11</td><td class="n m">2</td><td class="n m">0</td><td class="n m">854</td><td class="n m">0</td><td>–</td></tr></table></div>
